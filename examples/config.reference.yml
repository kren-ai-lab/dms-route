# Complete reference for `dmsroute run --config`.
# Active values form a valid, conservative configuration. Paths are resolved
# from the working directory, and optional score transformations are disabled.

proteingym:
  # Required resource name; dms_substitutions and dms_indels are processable.
  resource: dms_substitutions
  # Required base directory for downloaded and standardized files.
  dir_base: datasets/proteingym

  # Optional defaults inherited by every ProteinGym dataset. Dataset-level
  # build_kwargs are deep-merged over these values.
  default_build_kwargs:
    # Source columns copied into the standardized variant and score fields.
    score_col: DMS_score
    variant_col: mutant
    # Invalid auxiliary parsing raises only when this is true.
    strict_variant_parsing: false
    # null selects the delimiter from the file suffix.
    sep: null
    # The builder accepts this option, but `dmsroute run` passes an already
    # resolved WT sequence, so this workflow does not consult the FASTA path.
    wt_fasta_path: null

    # WT-relative methods: ratio, log_ratio, log2_ratio, or difference.
    add_relative_score: false
    relative_method: log_ratio
    # relative_method: ratio
    # relative_method: log2_ratio
    # relative_method: difference
    relative_output_col: score_log_ratio

    # Binary labels require relative scores. Values beyond +/-delta receive the
    # non-neutral classes; boundary values are neutral (label 999 by default).
    add_binary_label: false
    delta: 0.1
    higher_is_better: true
    # higher_is_better: false
    binary_output_col: score_binary_like

    # A synthetic WT row is scoreless and does not supply a transform baseline.
    add_wildtype_row: false
    # true retains only rows whose status is OK.
    drop_failed: false
    # Final schema and sequence validation is enabled by default.
    validate_output: true
    # true makes a missing observed/fallback WT score fatal for requested transforms.
    require_wt_for_transforms: false

  # Required non-empty list of canonical DMS_id values (without `.csv`).
  datasets:
    - dataset_id: BLAT_ECOLX_Jacquier_2013
      # Dataset-level WT fallbacks are separate from builder overrides.
      wt_sequence: null
      wt_score: null
      # Optional per-dataset overrides; pipeline-owned inputs cannot be replaced.
      build_kwargs: {}

# Omit this section to skip live MaveDB API processing. Snapshot acquisition is
# available elsewhere, not through the configurable YAML pipeline.
mavedb:
  # Required base directory for downloaded and standardized files.
  dir_base: datasets/mavedb

  # Optional defaults inherited by every MaveDB dataset.
  default_build_kwargs:
    # null selects the delimiter from the file suffix.
    sep: null
    # The builder accepts this option, but `dmsroute run` passes an already
    # resolved WT sequence, so this workflow does not consult the FASTA path.
    wt_fasta_path: null

    # WT-relative methods: ratio, log_ratio, log2_ratio, or difference.
    add_relative_score: false
    relative_method: log_ratio
    # relative_method: ratio
    # relative_method: log2_ratio
    # relative_method: difference
    relative_output_col: score_log_ratio

    # Binary labels require relative scores. Neutral rows receive label 999.
    add_binary_label: false
    delta: 0.1
    higher_is_better: true
    # higher_is_better: false
    binary_output_col: score_binary_like

    add_wildtype_row: false
    drop_failed: false
    validate_output: true
    require_wt_for_transforms: false

  # Required non-empty list of permanent MaveDB score-set URNs.
  datasets:
    - dataset_id: urn:mavedb:00000001-a-4
      # Dataset-level WT fallbacks are separate from builder overrides.
      wt_sequence: null
      wt_score: null
      # Amino-acid substitutions, bounded single-residue deletions, and bounded
      # single-residue insertions between adjacent anchors are supported. More
      # complex MaveDB indels remain unsupported.
      hgvs_col: hgvs_pro
      # If omitted, score, scores.score, DMS_score, then fitness are tried.
      score_col: score
      # Optional per-dataset overrides; score_col and hgvs_col stay above.
      build_kwargs: {}

output:
  # Optional; defaults to this path when omitted.
  summary_dir: datasets/summaries
