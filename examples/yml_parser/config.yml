# config.yml
# ----------
# Configuration for run_dms_parser.py
#
# Add/remove datasets or tweak build_kwargs here — no need to touch the
# Python script. `default_build_kwargs` applies to every dataset in that
# source; give any individual dataset entry its own `build_kwargs` block to
# override just the keys you need for that one (deep-merged over defaults).

proteingym:
  enabled: true
  dir_base: datasets/proteingym

  metadata_url: "https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv"
  benchmark_url: "https://proteingym.s3.us-east-2.amazonaws.com/DMS_substitutions.parquet"

  default_build_kwargs:
    score_col: DMS_score
    variant_col: mutant
    add_relative_score: true
    relative_method: log_ratio
    relative_output_col: score_log_ratio
    add_binary_label: true
    delta: 0.15
    higher_is_better: true
    binary_output_col: score_binary_like

  datasets:
    - filename: BLAT_ECOLX_Jacquier_2013.csv
    - filename: ENVZ_ECOLI_Ghose_2023.csv
    - filename: A0A247D711_LISMN_Stadelmann_2021.csv
    - filename: HXK4_Human_Gersing_2023_activity.csv
    # Add more ProteinGym CSV filenames (must exist in DMS_substitutions.csv) below.
    # Per-dataset overrides are optional, e.g.:
    # - filename: A4_HUMAN_Seuma_2022.csv
    #   build_kwargs:
    #     delta: 0.2

mavedb:
  enabled: true
  dir_base: datasets/mavedb

  base_url: "https://api.mavedb.org/api/v1"

  default_build_kwargs:
    add_relative_score: false
    drop_failed: false

  datasets:
    - urn: "urn:mavedb:00000001-a-4"   # UBE2I
    - urn: "urn:mavedb:00000665-a-1"   # PAX6
    - urn: "urn:mavedb:00000001-c-2"   # CALM1
    - urn: "urn:mavedb:00000080-a-2"   # avGFP
    # Per-dataset column overrides are optional, e.g. if a score-set uses
    # non-standard column names:
    # - urn: "urn:mavedb:00000XXX-a-1"
    #   hgvs_col: hgvs_pro
    #   score_col: fitness

output:
  summary_dir: datasets/summaries
