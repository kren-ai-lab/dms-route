[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-parser"
version = "0.1.0"
description = "Internal utilities for downloading, parsing, and transforming DMS datasets from MaveDB and ProteinGym."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "David Medina" }
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]