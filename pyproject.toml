[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmsroute"
version = "0.1.0"
description = "Utilities for acquiring, parsing, validating, harmonizing, and standardizing DMS datasets from MaveDB and ProteinGym."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kren AI Lab", email = "krenai@umag.cl" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "PyYAML>=6.0",
  "pyarrow>=15.0",
  "typer>=0.27.1,<0.28",
]

[project.scripts]
dmsroute = "dmsroute.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/kren-ai-lab/dms-route"

[tool.setuptools.packages.find]
include = ["dmsroute*"]
