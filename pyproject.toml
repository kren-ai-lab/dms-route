[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-parser"
version = "0.1.0"
description = "Internal utilities for downloading, parsing, and transforming DMS datasets from MaveDB and ProteinGym."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "David Medina" }
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "PyYAML>=6.0",
  "pyarrow>=15.0",
  "typer>=0.27.1,<0.28",
]

[project.scripts]
dms-parser = "dms_parser.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
